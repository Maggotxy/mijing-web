server {
    # 仅回环：公网不可见，供 frpc-mjvia-edge39 的 localPort 指向
    listen 127.0.0.1:3101;
    server_name mjvia.com www.mjvia.com;

    # SEO / GEO 静态文件
    location = /robots.txt {
        root /var/www/seo;
    }
    location = /sitemap.xml {
        root /var/www/seo;
        add_header Content-Type application/xml;
    }
    location = /llms.txt {
        root /var/www/seo;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # 构建产物由 workerd 提供，但它不响应 Range，Safari 因此不开播。
    # 媒体交由此处直读磁盘，获得原生 206 / Accept-Ranges。
    location /images/ {
        root /home/sivita/mijing/mijing-preview/dist/client;
        types { video/mp4 mp4; image/jpeg jpg jpeg; image/png png; image/webp webp; }
        add_header Accept-Ranges bytes;
        expires 1d;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # HTML is owned by the application React tree.
        proxy_buffering on;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-cache, no-store, max-age=0" always;

    }
}
