server {
    # 仅回环：公网不可见，供 frpc-mjvia-edge39 的 localPort 指向
    listen 127.0.0.1:3101;
    server_name mjvia.com www.mjvia.com;

    # ── 基础安全响应头（静态 location 无自身 add_header 时自动继承）──
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SEO / GEO 静态文件
    location = /robots.txt {
        root /var/www/seo;
        default_type text/plain;
    }
    location = /sitemap.xml {
        root /var/www/seo;
        default_type application/xml;
    }
    location = /llms.txt {
        root /var/www/seo;
        default_type text/plain;
        charset utf-8;
    }
    location = /indexnow-key.txt {
        root /var/www/seo;
        default_type text/plain;
        charset utf-8;
    }
    location = /manifest.json {
        root /var/www/seo;
        default_type application/manifest+json;
        charset utf-8;
    }
    location = /googlec9f09bb0f617cdfe.html {
        root /var/www/seo;
        default_type text/html;
        charset utf-8;
    }
    location = /baidu_verify_codeva-XDK8dGY9Mh.html {
        root /var/www/seo;
        default_type text/html;
        charset utf-8;
    }
    location = /about {
        alias /var/www/seo/about.html;
        default_type text/html;
        charset utf-8;
    }
    # 友好 404 页：保持 404 状态码，正文用独立静态页，避免回落到首页壳
    error_page 404 /404.html;
    location = /404.html {
        root /var/www/seo;
        default_type text/html;
        charset utf-8;
    }
    location = /.well-known/ai.txt {
        root /var/www/seo;
        default_type text/plain;
        charset utf-8;
    }
    location = /ai.txt {
        root /var/www/seo;
        default_type text/plain;
        charset utf-8;
    }
    location = /ai/summary.json {
        root /var/www/seo;
        default_type application/json;
        charset utf-8;
    }
    location = /ai/faq.json {
        root /var/www/seo;
        default_type application/json;
        charset utf-8;
    }
    location = /ai/service.json {
        root /var/www/seo;
        default_type application/json;
        charset utf-8;
    }
    location = /feed.xml {
        root /var/www/seo;
        default_type application/rss+xml;
        charset utf-8;
    }

    # 社交分享卡图：独立静态根，不依赖前端 dist 目录
    location = /images/og-image.png {
        root /var/www/seo;
        default_type image/png;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location ~ ^/images/(apple-touch-icon|icon-192|icon-512)\.png$ {
        root /var/www/seo;
        default_type image/png;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Next.js 带 hash 的构建产物：直读磁盘，长缓存 immutable，避免被代理块 no-store 污染
    location /_next/static/ {
        root /home/sivita/mijing/mijing-preview/dist/client;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 构建产物由 workerd 提供，但它不响应 Range，Safari 因此不开播。
    # 媒体交由此处直读磁盘，获得原生 206 / Accept-Ranges。
    location /images/ {
        root /home/sivita/mijing/mijing-preview/dist/client;
        types { video/mp4 mp4; image/jpeg jpg jpeg; image/png png; image/webp webp; }
        add_header Accept-Ranges bytes;
        expires 1d;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Buffer application responses; media uses the dedicated Range-capable location.
        proxy_buffering on;
        # 上游返回 404 时由 nginx error_page 接管为友好 404 静态页，状态码保持 404
        proxy_intercept_errors on;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-cache, no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Application owns all HTML and metadata; proxy must not rewrite React output.
    }
}
