name: seo-checks

# Deploy regression guard for mjvia.com SEO/GEO surfaces.
# Runs on push to main and weekly. Cheap checks fail the run;
# Lighthouse and the GEO Optimizer score are advisory only
# (continue-on-error): the 0-100 GEO score is a self-built model whose
# link to real citation rates is unverified (see 2026-10-31 category-best
# research) - it is a regression guard, never an optimization target.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:

jobs:
  live-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Homepage is live and renamed
        run: |
          curl -fsSL --max-time 20 https://mjvia.com/ -o /tmp/home.html
          grep -q '小觅法务' /tmp/home.html
          # Product name must be 小觅法务; 觅径 may appear only as the company
          # legal name 天津觅径科技有限公司. MIJING is allowed as the brand's
          # English name (alternateName in Organization JSON-LD).
          test "$(grep -o '觅径' /tmp/home.html | wc -l)" = "$(grep -o '天津觅径科技有限公司' /tmp/home.html | wc -l)"
          grep -q '"alternateName":"MIJING"' /tmp/home.html

      - name: Guide pages return 200 with structured data
        run: |
          curl -fsSL --max-time 20 "https://mjvia.com/guide" -o /tmp/page.html
          grep -q '"@type":"CollectionPage"' /tmp/page.html
          for p in guide/sme-contract-review guide/contract-key-clauses guide/onboarding-document-checklist guide/termination-risk-check guide/overdue-payment-recovery; do
            curl -fsSL --max-time 20 "https://mjvia.com/$p" -o /tmp/page.html
            grep -q '"@type":"Article"' /tmp/page.html
            grep -q '"@type":"FAQPage"' /tmp/page.html
          done

      - name: Sitemap lists only mjvia.com URLs and is valid XML
        run: |
          curl -fsSL --max-time 20 https://mjvia.com/sitemap.xml -o /tmp/sitemap.xml
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('/tmp/sitemap.xml')"
          test "$(grep -c '<loc>' /tmp/sitemap.xml)" = "8"
          for p in guide/sme-contract-review guide/contract-key-clauses guide/onboarding-document-checklist guide/termination-risk-check guide/overdue-payment-recovery; do
            grep -q "https://mjvia.com/$p" /tmp/sitemap.xml
          done
          ! grep -q -E '<loc>https?://[^m]' /tmp/sitemap.xml

      - name: GEO surfaces return 200
        run: |
          for p in llms.txt llms-full.txt ai.txt ai/summary.json ai/service.json ai/faq.json feed.xml robots.txt manifest.json sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://mjvia.com/$p")
            test "$code" = "200" || { echo "$p -> $code"; exit 1; }
          done

  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check every link reachable from the sitemap (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose https://mjvia.com/sitemap.xml
          fail: true

  geo:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: astral-sh/setup-uv@v3
      - name: GEO Optimizer audit (advisory, threshold 70)
        run: |
          uvx --from geo-optimizer-skill geo audit --url https://mjvia.com --threshold 70
      - name: llms.txt drift check (advisory)
        run: |
          uvx --from geo-optimizer-skill geo llms --check-drift --url https://mjvia.com || true

  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse SEO audit (advisory)
        run: |
          npm i -g lighthouse@12
          lighthouse https://mjvia.com --only-categories=seo --chrome-flags='--headless --no-sandbox' --output=json --output-path=/tmp/lh.json
          python3 -c "import json; d=json.load(open('/tmp/lh.json')); print('SEO score:', d['categories']['seo']['score'])"
